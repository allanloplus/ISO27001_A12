<title>資安事件管理動畫課</title>
<meta name="description" content="ISO/IEC 27001:2022 資訊安全事件管理（運作流程）動畫教學：Q版 Allan Lo 講師與助教阿拉蕾">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a fixed 1280×720 "classroom" stage scaled to fit; player chrome and chapter list sit below it.
   The stage is one deliberate light look (it is the video frame); the page chrome follows the viewer's theme. */
:root{
  --page-bg:#eef2f7; --page-fg:#1d2b44; --page-muted:#5b6b84; --page-line:#cfd8e5; --page-card:#ffffff; --page-accent:#2f5fb3;
  --ink:#1d2b44; --ink-2:#4a5a74; --paper:#ffffff; --sky:#e3eefa; --navy:#2c4a7a;
  --amber:#f2a516; --red:#df4a3f; --green:#3c9f5a; --leaf:#d7ebb5; --plum:#c63d72; --teal:#1f8c94;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei","WenQuanYi Zen Hei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","WenQuanYi Zen Hei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page-bg:#0f1622; --page-fg:#e4ebf5; --page-muted:#93a3bb; --page-line:#2a3850; --page-card:#172234; --page-accent:#7fa8f0; color-scheme:dark}}
:root[data-theme="dark"]{--page-bg:#0f1622; --page-fg:#e4ebf5; --page-muted:#93a3bb; --page-line:#2a3850; --page-card:#172234; --page-accent:#7fa8f0; color-scheme:dark}

html,body{background:var(--page-bg);color:var(--page-fg)}
body{margin:0;font-family:var(--f-body);padding-inline:16px;padding-block:16px 32px;box-sizing:border-box}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.pagehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.pagehead h1{font-family:var(--f-display);font-size:clamp(20px,3vw,28px);margin:0;text-wrap:balance}
.pagehead p{margin:0;color:var(--page-muted);font-size:14px}

/* ---------- stage ---------- */
#viewport{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:#000;box-shadow:0 10px 30px rgba(20,35,60,.18)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  font-family:var(--f-body);color:var(--ink);
  background:radial-gradient(1200px 500px at 50% -10%,#ffffff 0%,var(--sky) 60%,#cfe0f3 100%)}
#stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(44,74,122,.10) 1.2px,transparent 1.3px);background-size:22px 22px;pointer-events:none}
#stage .floor{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(#c6d9ee,#b5cbe4)}

.topbar{position:absolute;left:20px;right:20px;top:14px;height:52px;display:flex;align-items:center;gap:14px}
#secChip{font-family:var(--f-display);font-size:20px;padding:6px 16px;border-radius:999px;background:var(--navy);color:#fff;white-space:nowrap}
#secChip.s-audit{background:var(--teal)} #secChip.s-ng{background:var(--red)} #secChip.s-case{background:#7a4fb5} #secChip.s-quiz{background:var(--plum)}
#sceneTitle{font-family:var(--f-display);font-size:32px;margin:0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#counter{font-size:16px;color:var(--ink-2);font-variant-numeric:tabular-nums;background:rgba(255,255,255,.7);padding:4px 12px;border-radius:999px}

#board{position:absolute;left:236px;top:78px;width:808px;height:500px;background:var(--paper);border-radius:22px;
  box-shadow:0 2px 0 #c4d4e8,0 18px 40px rgba(29,43,68,.14);overflow:hidden}
#boardInner{position:absolute;inset:24px;font-size:20px;line-height:1.45}
#boardInner.enter{animation:boardIn .6s cubic-bezier(.2,.8,.2,1)}
@keyframes boardIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
#boardInner [data-step]{opacity:0;transform:translateY(16px) scale(.98);transition:opacity .5s ease,transform .55s cubic-bezier(.2,.9,.25,1.2)}
#boardInner [data-step].on{opacity:1;transform:none}

/* subtitles */
#sub{position:absolute;left:236px;top:592px;width:808px;height:112px;box-sizing:border-box;padding:14px 22px 12px;background:#fff;border-radius:20px;
  border:3px solid var(--ink);display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 0 rgba(29,43,68,.15);transition:opacity .3s}
#sub::before{content:"";position:absolute;top:44px;width:22px;height:22px;background:#fff;border:3px solid var(--ink);transform:rotate(45deg)}
#sub.from-A::before{left:-14px;border-top:none;border-right:none}
#sub.from-R::before{right:-14px;border-bottom:none;border-left:none}
#sub.from-none::before{display:none}
#sub .who{font-family:var(--f-display);font-size:17px;color:#fff;align-self:flex-start;padding:1px 12px;border-radius:999px;background:var(--navy)}
#sub.from-R .who{background:var(--plum);align-self:flex-end}
#sub .txt{font-size:24px;font-weight:500;line-height:1.35;color:var(--ink)}
#sub .txt.long{font-size:20px}
#sub.dim{opacity:.55}
#sub.hidecc{opacity:0}

/* characters: expression portraits cut from the character sheets (tools/crop_characters.py) */
.char{position:absolute;bottom:6px;width:226px;height:330px}
#allan{left:6px} #arale{right:6px}
.char .card{position:absolute;left:2px;right:2px;bottom:36px;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:#fff;
  border:4px solid var(--navy);box-shadow:0 6px 0 rgba(29,43,68,.18);transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite;
  transition:box-shadow .25s,filter .25s}
#arale .card{border-color:var(--plum)}
.char .card img{display:block;width:100%;height:100%;object-fit:cover}
.char:not(.talking) .card{filter:saturate(.88) brightness(.97)}
.char.talking .card{box-shadow:0 6px 0 rgba(29,43,68,.18),0 0 0 7px rgba(242,165,22,.6);animation:nod .7s ease-in-out infinite alternate}
.char .tag{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-family:var(--f-display);font-size:17px;white-space:nowrap;
  padding:2px 14px;border-radius:999px;color:#fff;background:var(--navy);box-shadow:0 3px 0 rgba(0,0,0,.15)}
#arale .tag{background:var(--plum)}
.char.act-jump .card{animation:jump .55s cubic-bezier(.3,.6,.4,1) 2}
.char.act-happy .card,.char.act-wave .card{animation:hop .45s ease-in-out infinite alternate}
.char.act-shock .card{animation:shake .12s linear 6}
.char.act-think .card,.char.act-confused .card{transform:rotate(-2.5deg);animation:none}
.char.act-sad .card{transform:translateY(6px);animation:none}
.char .fx{position:absolute;top:-34px;left:50%;z-index:2;font-family:var(--f-display);font-size:44px;font-weight:900;opacity:0;transform:translate(-50%,10px) scale(.6);
  transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1);text-shadow:0 3px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
#allan .fx{left:84%} #arale .fx{left:16%}
.char.act-shock .fx,.char.act-think .fx,.char.act-happy .fx,.char.act-jump .fx,.char.act-confused .fx,.char.act-sad .fx,.char.act-wink .fx{opacity:1;transform:translate(-50%,0) scale(1)}
.char.act-shock .fx{color:var(--red)} .char.act-think .fx,.char.act-confused .fx,.char.act-sad .fx{color:var(--teal)}
.char.act-happy .fx,.char.act-jump .fx,.char.act-wink .fx{color:var(--amber)}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@keyframes nod{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg) translateY(-3px)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-46px) scaleY(1.04)}70%{transform:translateY(0) scaleY(.94)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* start cover */
[hidden]{display:none!important}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(18,30,52,.55);z-index:5;border:0;cursor:pointer;color:#fff;font-family:var(--f-display)}
#cover .big{width:128px;height:128px;border-radius:50%;background:var(--amber);display:grid;place-items:center;box-shadow:0 10px 0 #b9790b,0 18px 40px rgba(0,0,0,.35);transition:transform .15s}
#cover:hover .big,#cover:focus-visible .big{transform:scale(1.06)}
#cover .big svg{width:56px;height:56px;margin-left:8px}
#cover span{font-size:38px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
#cover small{font-size:20px;opacity:.85}

/* ---------- board components ---------- */
.h3{font-family:var(--f-display);font-size:24px;color:var(--ink);margin-bottom:8px}
.card{background:#f5f8fc;border:2px solid #dde6f2;border-radius:16px;padding:16px 18px;box-sizing:border-box}
.note{font-size:17px;color:var(--ink-2);margin:10px 0 0}
ul{margin:6px 0 0;padding-left:1.2em} li{margin:2px 0}

.cover{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.cover-kicker{font-size:19px;color:var(--teal);font-weight:700;letter-spacing:.06em}
.cover-title{font-family:var(--f-display);font-size:80px;line-height:1.05;margin:0;color:var(--ink)}
.cover-en{font-size:24px;color:var(--ink-2);letter-spacing:.02em}
.cover-chips{display:flex;gap:12px;margin-top:10px}
.chip{font-family:var(--f-display);font-size:22px;padding:8px 18px;border-radius:14px;color:#fff}
.chip.c1{background:var(--navy)} .chip.c2{background:var(--teal)} .chip.c3{background:var(--red)}
.cover-by{margin-top:14px;font-size:17px;color:var(--ink-2)}

.flowmap{position:relative;width:760px;height:452px;font-size:17px}
.fm-plan{position:absolute;left:0;top:0;width:256px;height:148px;border:3px dashed #3d5a99;border-radius:16px;background:#fff;box-sizing:border-box;padding:10px 14px;text-align:center}
.fm-roles{display:flex;gap:6px;justify-content:center}
.fm-roles span{font-size:14px;background:var(--sky);border-radius:999px;padding:1px 10px;color:var(--navy)}
.fm-code{font-family:var(--f-display);font-size:34px;color:var(--navy);line-height:1.1;margin-top:4px}
.fm-name{font-weight:700;font-size:18px;line-height:1.3}
.fm-fix{position:absolute;right:-30px;top:-14px;background:var(--red);color:#fff;font-size:14px;padding:4px 10px;border-radius:10px;transform:rotate(4deg)!important;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.fm-fix:not(.on){opacity:0!important}
.fm-comm{position:absolute;left:262px;top:62px;width:52px;height:0;border-top:4px dashed #3d5a99}
.fm-comm::after{content:"";position:absolute;right:-6px;top:-10px;border:8px solid transparent;border-left:12px solid #3d5a99}
.fm-commlbl{position:absolute;left:6px;top:-30px;font-size:15px;color:#3d5a99;font-weight:700}
.fm-roleset{position:absolute;left:328px;top:22px;width:200px;height:86px;border-radius:14px;background:#eef4fb;border:2px solid #b8cbe6;display:grid;place-items:center;text-align:center;font-weight:700;line-height:1.35}
.fm-band{position:absolute;left:10px;top:196px;width:750px;height:62px;background:linear-gradient(90deg,#d6e6f7,#bcd6f2);clip-path:polygon(0 0,95% 0,100% 50%,95% 100%,0 100%)}
.fm-node{position:absolute;top:172px;width:132px;height:110px;border-radius:16px;background:#fff;border:3px solid var(--navy);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.3;font-weight:700;font-size:16px;box-shadow:0 4px 0 #c4d4e8}
.fm-node b{font-family:var(--f-display);font-size:26px;color:var(--navy);font-weight:400}
.fm-node.n1{left:20px} .fm-node.n2{left:166px} .fm-node.n3{left:312px} .fm-node.n4{left:458px;border-color:var(--green)} .fm-node.n5{left:604px;border-color:var(--amber)}
.fm-node.n2.on{transition-delay:.15s} .fm-node.n3.on{transition-delay:.3s} .fm-node.n4.on{transition-delay:.45s} .fm-node.n5.on{transition-delay:.6s}
.fm-base{position:absolute;left:0;top:318px;width:420px;height:126px;background:var(--leaf);border-radius:16px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;text-align:center;font-weight:700;font-size:19px}
.fm-base b{display:block;font-family:var(--f-display);font-size:30px;color:#2f6b2a;font-weight:400}
.fm-feed-h{position:absolute;left:420px;top:368px;width:116px;height:26px;background:var(--leaf)}
.fm-feed-v{position:absolute;left:510px;top:300px;width:26px;height:94px;background:var(--leaf)}
.fm-feed-v::before{content:"";position:absolute;left:-14px;top:-20px;border:27px solid transparent;border-bottom:22px solid var(--leaf);border-top:0}

.evinc{display:grid;grid-template-columns:1fr 150px 1fr;gap:16px;align-items:center;height:100%}
.ev-tag,.inc-tag{font-family:var(--f-display);font-size:22px;color:#fff;padding:4px 12px;border-radius:10px;display:inline-block;margin-bottom:6px}
.ev-tag{background:var(--amber)} .inc-tag{background:var(--red)}
.evinc .card p{margin:4px 0;font-size:18px}
.funnel{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700}
.fn-top{width:150px;background:#ffe3a8;text-align:center;padding:8px 0;clip-path:polygon(0 0,100% 0,85% 100%,15% 100%)}
.fn-mid{width:112px;background:var(--teal);color:#fff;text-align:center;padding:10px 0;font-size:16px;line-height:1.3;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}
.fn-bot{width:70px;background:#f7b3ad;text-align:center;padding:8px 0;clip-path:polygon(0 0,100% 0,80% 100%,20% 100%)}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:c}
.checks li{counter-increment:c;display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto auto;column-gap:14px;background:#f5f8fc;border-radius:14px;padding:10px 16px;margin:0}
.checks li::before{content:counter(c);grid-row:1/3;width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--f-display);font-size:26px;display:grid;place-items:center;align-self:center}
.checks b{font-family:var(--f-display);font-size:24px;font-weight:400}
.checks span{font-size:18px;color:var(--ink-2)}

.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;height:100%}
.tri-col{background:#f5f8fc;border-radius:16px;padding:16px;border-top:8px solid var(--navy)}
.tri-col:nth-child(2){border-top-color:var(--teal)} .tri-col:nth-child(3){border-top-color:var(--amber)}
.tri-code{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--navy)}
.tri-name{font-weight:900;font-size:21px;margin:6px 0 4px}
.tri-col li{font-size:18px;margin:6px 0}

.split{display:grid;grid-template-columns:1fr 1.32fr;gap:16px;height:100%}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill-row span{background:#fff;border:2px solid #c9d7ea;border-radius:999px;padding:3px 12px;font-size:17px}
.motto{margin-top:18px;font-family:var(--f-display);font-size:30px;color:var(--red);line-height:1.25}
.grade table{width:100%;border-collapse:collapse;font-size:17px}
.grade th{background:var(--navy);color:#fff;padding:6px;font-weight:700}
.grade td{padding:8px 6px;border-bottom:1px solid #dde6f2;vertical-align:top}
.grade td:first-child{font-weight:900;text-align:center;width:44px}
.lv1 td:first-child{color:var(--green)} .lv2 td:first-child{color:#c98500} .lv3 td:first-child{color:var(--red)}
.lv3{background:#fdeceb}
.lv2.on{transition-delay:.25s!important} .lv3.on{transition-delay:.5s!important}

.resp{display:flex;flex-direction:column;gap:16px;height:100%}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps4 div{background:var(--navy);color:#fff;padding:12px 18px 12px 30px;clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%,10% 50%);display:flex;flex-direction:column}
.steps4 div:first-child{clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%);padding-left:18px}
.steps4 div:nth-child(2){background:#3a5f99} .steps4 div:nth-child(3){background:var(--teal)} .steps4 .comm{background:var(--amber);color:var(--ink)}
.steps4 b{font-family:var(--f-display);font-size:28px;font-weight:400}
.steps4 span{font-size:15px;line-height:1.3}
.evid-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.evid-row span{background:var(--green);color:#fff;font-weight:700;padding:4px 14px;border-radius:999px}
.evid-row i{flex:1;height:3px;background:#a9cfb4}
.evid li{font-size:18px}

.loop{position:relative;width:760px;height:452px}
.loop::before{content:"";position:absolute;left:120px;top:56px;width:520px;height:340px;border:4px dashed #b8cbe6;border-radius:50%}
.lp-core{position:absolute;left:290px;top:146px;width:180px;height:160px;border-radius:50%;background:var(--amber);display:grid;place-items:center;text-align:center;font-size:18px;line-height:1.35;color:var(--ink)}
.lp-core b{font-family:var(--f-display);font-size:24px;font-weight:400}
.lp{position:absolute;width:196px;padding:10px 12px;border-radius:16px;background:#fff;border:3px solid var(--navy);text-align:center;box-sizing:border-box;box-shadow:0 4px 0 #c4d4e8}
.lp b{display:block;font-family:var(--f-display);font-size:23px;font-weight:400;color:var(--navy)}
.lp span{font-size:15px;color:var(--ink-2);line-height:1.3;display:block}
.lp1{left:282px;top:0} .lp2{left:560px;top:110px} .lp3{left:500px;top:330px} .lp4{left:64px;top:330px} .lp5{left:4px;top:110px}

.case{display:grid;grid-template-columns:1fr 228px;gap:16px;height:100%}
.tl{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:18px;justify-content:center}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:4px;background:#c9d7ea;border-radius:2px}
.tl-i{position:relative;display:grid;grid-template-columns:104px 1fr 58px;align-items:center;gap:8px;background:#f5f8fc;border-radius:12px;padding:12px 10px}
.tl-i::before{content:"";position:absolute;left:-19px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--navy);border:3px solid #fff}
.tl-i.bad{background:#fdeceb} .tl-i.bad::before{background:var(--red)}
.tl-i time{font-weight:900;font-size:17px;color:var(--navy);font-variant-numeric:tabular-nums}
.tl-i p{margin:0;font-size:17px;line-height:1.35}
.tl-i b{color:var(--red)}
.tl-i em{font-style:normal;font-family:var(--f-display);font-size:18px;background:var(--amber);border-radius:8px;text-align:center;padding:2px 0}
.fixes{background:#e9f5ec;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fixes .h3{color:var(--green);margin:0}
.fixes span{background:#fff;border-left:5px solid var(--green);border-radius:8px;padding:6px 10px;font-size:16px;font-weight:700;line-height:1.3}

.audit3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;height:100%}
.au{display:flex;flex-direction:column}
.au-h{font-family:var(--f-display);font-size:26px;color:var(--teal)}
.au li{font-size:18px;margin:6px 0}
.tip{margin-top:auto;background:#e3f3f4;color:#14646a;font-weight:700;border-radius:10px;padding:8px 10px;font-size:16px}
.tip.warn{background:#fdeceb;color:var(--red);font-size:20px;font-family:var(--f-display);font-weight:400}

.trace{display:grid;grid-template-columns:250px 126px 1fr;grid-template-rows:auto auto;gap:14px;height:100%;align-items:center}
.tr-start{width:120px;height:120px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:24px;line-height:1.25;grid-column:2;grid-row:1;justify-self:center;box-shadow:0 0 0 10px #d3ecee}
.tr-back,.tr-fwd{display:flex;flex-direction:column;gap:6px}
.tr-back{grid-column:1;grid-row:1} .tr-fwd{grid-column:3;grid-row:1}
.tr-lbl{font-family:var(--f-display);font-size:22px;color:var(--teal)}
.tr-back span,.tr-fwd span{background:#f5f8fc;border-radius:10px;padding:5px 10px;font-size:16px;display:flex;gap:8px;align-items:baseline}
.tr-back span b,.tr-fwd span b{font-family:var(--f-display);font-weight:400;color:var(--navy);font-size:18px;min-width:76px}
.tr-fwd span b{min-width:84px}
.tr-tech{grid-column:1/4;grid-row:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff8e6;border-radius:14px;padding:12px 14px}
.tr-tech b{font-family:var(--f-display);font-weight:400;font-size:22px;color:#a66d00;margin-right:6px}
.tr-tech span{background:#fff;border:2px solid #f2d18a;border-radius:999px;padding:3px 12px;font-size:16px}

.law{width:100%;border-collapse:separate;border-spacing:0;font-size:18px}
.law th{background:var(--teal);color:#fff;padding:8px 10px;text-align:left}
.law th:first-child{border-radius:12px 0 0 0} .law th:last-child{border-radius:0 12px 0 0}
.law td{padding:10px;border-bottom:2px solid #e3ebf5;vertical-align:top;line-height:1.4}
.law small{color:var(--ink-2);font-size:14px}
.law b{color:var(--red)}
.foot{font-size:16px;color:var(--ink-2);margin:12px 0 0}

.ngs{display:flex;flex-direction:column;gap:9px}
.ng{display:grid;grid-template-columns:50px 1fr 84px;gap:14px;align-items:center;background:#f8f3f3;border-radius:14px;padding:8px 14px;height:76px;box-sizing:border-box}
.ng i{font-style:normal;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:22px}
.ng b{display:block;font-family:var(--f-display);font-size:23px;font-weight:400}
.ng span{font-size:17px;color:var(--ink-2)}
.ng em{font-style:normal;font-family:var(--f-display);font-size:30px;color:var(--red);border:4px solid var(--red);border-radius:12px;text-align:center;transform:rotate(-12deg);opacity:0}
.ng.on em{animation:stamp .45s .35s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{from{opacity:0;transform:rotate(-12deg) scale(2.6)}to{opacity:.95;transform:rotate(-12deg) scale(1)}}

.finding{display:flex;flex-direction:column;gap:12px;height:100%}
.fd{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;border-radius:16px;padding:14px 18px;background:#f5f8fc}
.fd b{font-family:var(--f-display);font-weight:400;font-size:24px;color:#fff;border-radius:12px;text-align:center;padding:10px 0}
.fd p{margin:0;font-size:19px}
.fd1 b{background:var(--navy)} .fd2 b{background:var(--teal)} .fd3 b{background:var(--red)}

.quiz{display:flex;flex-direction:column;gap:18px;height:100%;justify-content:center}
.q{font-family:var(--f-display);font-size:32px;line-height:1.35;text-align:center}
.q b{color:var(--red);font-weight:400}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:3px solid #c9d7ea;border-radius:16px;padding:14px 18px;font-size:22px;font-weight:700;background:#fff;transition:all .4s}
#boardInner[data-cur]:not([data-cur="0"]) .opt{opacity:.4}
#boardInner[data-cur]:not([data-cur="0"]) .opt.ok{opacity:1;border-color:var(--green);background:#e9f5ec;transform:scale(1.04)}
.ans{background:var(--green);color:#fff;border-radius:14px;padding:12px 18px;font-size:22px;font-weight:700;text-align:center}

.sum{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px;height:100%}
.sm{border-radius:18px;padding:16px;background:#f5f8fc;display:flex;flex-direction:column;gap:10px}
.sm-h{font-family:var(--f-display);font-size:26px;color:#fff;border-radius:12px;padding:6px 12px;text-align:center}
.sm1 .sm-h{background:var(--navy)} .sm2 .sm-h{background:var(--teal)} .sm3 .sm-h{background:var(--red)}
.bul{display:flex;flex-direction:column;gap:8px}
.bul span{background:#fff;border-radius:10px;padding:6px 12px 6px 34px;font-size:18px;font-weight:700;line-height:1.35;position:relative}
.bul span::before{content:"✓";position:absolute;left:12px;color:var(--teal);font-weight:900}
.sm3 .bul span::before{content:"✕";color:var(--red)}
.chain{display:flex;flex-direction:column;gap:5px}
.chain span{background:#fff;border:2px solid #c9d7ea;border-radius:10px;padding:3px 12px;font-family:var(--f-display);font-size:21px;position:relative}
.chain span::after{content:"▼";position:absolute;right:12px;color:#9fb3cf;font-size:13px;top:9px}
.chain span:last-child::after{content:""}

/* ---------- player chrome ---------- */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--page-card);border:1px solid var(--page-line);border-radius:14px;padding:10px 12px}
.controls button{font:inherit;font-size:15px;border:1px solid var(--page-line);background:var(--page-bg);color:var(--page-fg);border-radius:10px;padding:7px 12px;cursor:pointer;min-width:44px}
.controls button:hover{border-color:var(--page-accent)}
.controls button:focus-visible,.chapters button:focus-visible,#cover:focus-visible{outline:3px solid var(--page-accent);outline-offset:2px}
.controls #play{background:var(--page-accent);color:#fff;border-color:transparent;min-width:84px}
.controls .seek{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-width:0}
.controls input[type=range]{flex:1;min-width:0;accent-color:var(--page-accent)}
.controls time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--page-muted);white-space:nowrap}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.chapters button{font:inherit;text-align:left;display:flex;gap:10px;align-items:baseline;border:1px solid var(--page-line);background:var(--page-card);color:var(--page-fg);border-radius:10px;padding:8px 12px;cursor:pointer}
.chapters button[aria-current="true"]{border-color:var(--page-accent);box-shadow:inset 3px 0 0 var(--page-accent)}
.chapters .n{font-variant-numeric:tabular-nums;color:var(--page-muted);font-size:13px}
.chapters .sec{font-size:12px;color:var(--page-muted);display:block}
.chapters .t{font-size:15px;min-width:0}

/* record mode: bare 1280×720 stage for video capture */
body.rec{padding:0;background:#000}
body.rec .pagehead,body.rec .controls,body.rec .chapters,body.rec #cover{display:none}
body.rec .wrap{max-width:none}
body.rec #viewport{width:1280px;height:720px;border-radius:0;aspect-ratio:auto;box-shadow:none}

@media (prefers-reduced-motion: reduce){
  .char .card{animation:none!important}
  #boardInner [data-step]{transition:opacity .3s}
}
</style>

<div class="wrap">
  <header class="pagehead">
    <h1>資安事件管理動畫課</h1>
    <p>ISO/IEC 27001:2022 附錄A・運作流程｜講師 Allan Lo・助教阿拉蕾</p>
  </header>

  <div id="viewport">
    <div id="stage" aria-live="off">
      <div class="floor"></div>
      <div class="topbar"><span id="secChip">開場</span><h2 id="sceneTitle"></h2><span id="counter"></span></div>
      <div id="board"><div id="boardInner"></div></div>

      <!-- Allan Lo 講師／助教阿拉蕾：表情頭像取自 assets/source 的角色設定圖 -->
      <div class="char" id="allan">
        <div class="fx"></div>
        <div class="card"><img class="face" src="assets/chars/allan_smile.webp" alt="Allan Lo 講師"></div>
        <div class="tag">Allan 老師</div>
      </div>
      <div class="char" id="arale">
        <div class="fx"></div>
        <div class="card"><img class="face" src="assets/chars/arale_wink.webp" alt="助教阿拉蕾"></div>
        <div class="tag">助教 阿拉蕾</div>
      </div>

      <div id="sub" class="from-none"><span class="who"></span><span class="txt"></span></div>

      <button id="cover" type="button" aria-label="開始上課">
        <div class="big"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#1d2b44"/></svg></div>
        <span>開始上課</span>
        <small>建議開啟聲音・全片約 <b id="totalMin"></b> 分鐘</small>
      </button>
    </div>
  </div>

  <div class="controls" role="group" aria-label="播放控制">
    <button id="prev" type="button" aria-label="上一頁">◀ 上一頁</button>
    <button id="play" type="button">▶ 播放</button>
    <button id="next" type="button" aria-label="下一頁">下一頁 ▶</button>
    <div class="seek"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放進度"><time id="clock">0:00 / 0:00</time></div>
    <button id="cc" type="button" aria-pressed="true">字幕 開</button>
    <button id="fs" type="button">全螢幕</button>
  </div>

  <nav class="chapters" id="chapters" aria-label="章節"></nav>
</div>

<script>
(() => {
  const SCENES = window.SCENES, TIMING = window.TIMING;
  const LEAD = 1.0, GAP = 0.45, SCENE_GAP = 1.3, TAIL = 2.5;
  const REC = /[?&]record\b/.test(location.search);
  if (REC) document.body.classList.add("rec");

  /* ---- timeline: absolute start/end for every line ---- */
  const lines = []; const sceneStart = [];
  let t = LEAD;
  SCENES.forEach((sc, si) => {
    sceneStart.push(si === 0 ? 0 : t - SCENE_GAP * 0.6);
    let step = 0;
    sc.lines.forEach((ln, li) => {
      if (ln.step != null) step = Math.max(step, ln.step);
      const d = (TIMING[si] && TIMING[si][li]) ? TIMING[si][li].dur : Math.max(2, ln.say.length * 0.22);
      lines.push({ si, li, t0: t, t1: t + d, step, ln, src: TIMING[si] && TIMING[si][li] && TIMING[si][li].src });
      t += d + GAP;
    });
    t += SCENE_GAP;
  });
  const TOTAL = t - SCENE_GAP - GAP + TAIL;
  window.__total = TOTAL;
  window.__lines = lines.map(L => ({ t0: L.t0, src: L.src }));

  const $ = id => document.getElementById(id);
  const stage = $("stage"), viewport = $("viewport"), board = $("boardInner");
  const sub = $("sub"), subWho = sub.querySelector(".who"), subTxt = sub.querySelector(".txt");
  const chars = { A: $("allan"), R: $("arale") };
  const NAMES = { A: "Allan 老師", R: "助教 阿拉蕾" };
  const FX = { shock: "！！", think: "？", confused: "？", happy: "♪", jump: "★", wink: "♪", sad: "…" };
  /* act → expression portrait; Allan's talk/point lines flap between smile and open mouth */
  const FACES = {
    A: { prefix: "allan", idle: "smile", talk: "talk", point: "point", think: "think", confused: "confused", shock: "shock",
         happy: "laugh", wave: "laugh", jump: "laugh", wink: "wink", sad: "confused" },
    R: { prefix: "arale", idle: "wink", talk: "talk", point: "talk", think: "think", confused: "confused", shock: "shock",
         happy: "laugh", wave: "laugh", jump: "jump", wink: "wink", sad: "sad" }
  };
  const faceImg = { A: document.querySelector("#allan .face"), R: document.querySelector("#arale .face") };
  for (const k in FACES) new Set(Object.values(FACES[k]).slice(1)).forEach(n => { new Image().src = `assets/chars/${FACES[k].prefix}_${n}.webp`; });
  function faceFor(who, L, tt) {
    const F = FACES[who];
    if (!L || L.ln.who !== who) return F.idle;
    const act = L.ln.act || "talk", rel = tt - L.t0;
    if (who === "A" && (act === "talk" || act === "point")) {
      if (act === "point" && rel < 1.3) return F.point;
      return Math.floor(rel / 0.2) % 2 ? F.talk : F.idle;
    }
    return F[act] || F.talk;
  }
  function setFaces(L, tt) {
    for (const who in faceImg) {
      const src = `assets/chars/${FACES[who].prefix}_${faceFor(who, L, tt)}.webp`;
      if (faceImg[who].getAttribute("src") !== src) faceImg[who].setAttribute("src", src);
    }
  }
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  $("totalMin").textContent = Math.round(TOTAL / 60);

  /* ---- scale stage to viewport ---- */
  const fit = () => { if (!REC) stage.style.transform = `scale(${viewport.clientWidth / 1280})`; };
  new ResizeObserver(fit).observe(viewport); fit();

  /* ---- chapters ---- */
  const chapBtns = SCENES.map((sc, si) => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span class="n">${String(si + 1).padStart(2, "0")}</span><span class="t"><span class="sec"></span></span>`;
    b.querySelector(".sec").textContent = sc.sec;
    b.querySelector(".t").append(sc.title);
    b.onclick = () => seek(sceneStart[si] + (si ? 0.05 : 0));
    $("chapters").append(b);
    return b;
  });

  /* ---- render state at time t ---- */
  let curScene = -1, curLine = null, curStep = -1;
  function secClass(sec) {
    if (sec.includes("稽核")) return "s-audit";
    if (sec.includes("缺失")) return "s-ng";
    if (sec.includes("案例")) return "s-case";
    if (sec.includes("測驗")) return "s-quiz";
    return "";
  }
  function setScene(si) {
    curScene = si; curStep = -1;
    const sc = SCENES[si];
    board.innerHTML = sc.html;
    board.classList.remove("enter"); void board.offsetWidth; board.classList.add("enter");
    $("secChip").textContent = sc.sec; $("secChip").className = secClass(sc.sec);
    $("sceneTitle").textContent = sc.title;
    $("counter").textContent = `${si + 1} / ${SCENES.length}`;
    chapBtns.forEach((b, i) => b.setAttribute("aria-current", i === si ? "true" : "false"));
  }
  function setStep(n) {
    if (n === curStep) return; curStep = n;
    board.dataset.cur = n;
    board.querySelectorAll("[data-step]").forEach(el => el.classList.toggle("on", +el.dataset.step <= n));
  }
  function setSpeaker(L) {
    for (const k in chars) chars[k].className = "char";
    if (!L) { sub.classList.add("dim"); return; }
    const c = chars[L.ln.who];
    c.className = `char talking act-${L.ln.act || "talk"}`;
    c.querySelector(".fx").textContent = FX[L.ln.act] || "";
    sub.className = `from-${L.ln.who}` + (ccOn ? "" : " hidecc");
    subWho.textContent = NAMES[L.ln.who];
    subTxt.textContent = L.ln.say;
    subTxt.classList.toggle("long", L.ln.say.length > 58);
  }
  function lineAt(tt) { for (const L of lines) if (tt >= L.t0 && tt < L.t1) return L; return null; }
  function lastLineBefore(tt) { let r = null; for (const L of lines) { if (L.t0 <= tt) r = L; else break; } return r; }
  function sceneAt(tt) { let s = 0; sceneStart.forEach((st, i) => { if (tt >= st) s = i; }); return s; }

  function render(tt) {
    const si = sceneAt(tt);
    if (si !== curScene) setScene(si);
    const prev = lastLineBefore(tt);
    setStep(prev && prev.si === si ? prev.step : 0);
    const L = lineAt(tt);
    if (L !== curLine) {
      curLine = L;
      if (L) setSpeaker(L);
      else {
        for (const k in chars) chars[k].className = "char";
        if (prev && prev.si === si) sub.classList.add("dim");
        else { sub.className = "from-none" + (ccOn ? "" : " hidecc"); subWho.textContent = ""; subTxt.textContent = ""; }
      }
    }
    setFaces(L, tt);
    $("seek").value = Math.round(tt / TOTAL * 1000);
    $("clock").textContent = `${fmt(tt)} / ${fmt(TOTAL)}`;
  }

  /* ---- clock + audio ---- */
  let now = 0, playing = false, last = 0, audio = null, audioLine = null;
  function stopAudio() { if (audio) { audio.pause(); audio.src = ""; } audio = null; audioLine = null; }
  function syncAudio() {
    const L = lineAt(now);
    if (L === audioLine) return;
    stopAudio();
    if (!L || !L.src || REC) return;
    audioLine = L;
    audio = new Audio(L.src);
    audio.currentTime = Math.max(0, now - L.t0);
    audio.play().catch(() => {});
    // preload next
    const nx = lines[lines.indexOf(L) + 1]; if (nx && nx.src) { const p = new Audio(); p.preload = "auto"; p.src = nx.src; }
  }
  function frame(ts) {
    if (playing) {
      const dt = Math.min(0.25, (ts - last) / 1000);
      if (audio && audioLine && !audio.paused && !audio.ended && audio.currentTime > 0) now = audioLine.t0 + audio.currentTime;
      else now += dt;
      if (now >= TOTAL) { now = TOTAL; pause(); }
      syncAudio();
      render(now);
    }
    last = ts;
    requestAnimationFrame(frame);
  }
  function play() { if (now >= TOTAL - 0.1) now = 0; playing = true; $("cover").hidden = true; $("play").textContent = "❚❚ 暫停"; }
  function pause() { playing = false; stopAudio(); $("play").textContent = "▶ 播放"; }
  function seek(tt) { now = Math.max(0, Math.min(TOTAL, tt)); stopAudio(); curLine = undefined; render(now); }

  $("cover").onclick = play;
  $("play").onclick = () => playing ? pause() : play();
  $("prev").onclick = () => { const cur = sceneAt(now); const back = now - sceneStart[cur] < 1.5 ? cur - 1 : cur; seek(sceneStart[Math.max(0, back)] + 0.05); };
  $("next").onclick = () => seek(sceneStart[Math.min(SCENES.length - 1, sceneAt(now) + 1)] + 0.05);
  $("seek").oninput = e => seek(e.target.value / 1000 * TOTAL);
  let ccOn = true;
  $("cc").onclick = () => { ccOn = !ccOn; sub.classList.toggle("hidecc", !ccOn); $("cc").textContent = ccOn ? "字幕 開" : "字幕 關"; $("cc").setAttribute("aria-pressed", ccOn); };
  $("fs").onclick = () => { try { (document.fullscreenElement ? document.exitFullscreen() : viewport.requestFullscreen()).catch(() => {}); } catch (e) {} };
  document.addEventListener("fullscreenchange", fit);
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input,button")) { if (e.key !== " " || e.target.id === "seek") return; }
    if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === "ArrowRight") $("next").click();
    else if (e.key === "ArrowLeft") $("prev").click();
  });

  render(0);
  requestAnimationFrame(ts => { last = ts; requestAnimationFrame(frame); });

  /* ---- record mode: driven by wall clock, no audio ---- */
  if (REC) {
    $("cover").hidden = true;
    window.__seek = tt => render(tt);
    window.__sceneStart = sceneStart;
    window.__startRec = () => {
      const t0 = performance.now();
      const tick = () => { const tt = (performance.now() - t0) / 1000; render(Math.min(tt, TOTAL)); if (tt < TOTAL) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
      return Date.now();
    };
  }
})();
</script>
